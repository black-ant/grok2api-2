<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grok2API - 模型映射</title>
  <link rel="icon" href="/favicon.ico?v={{APP_VERSION}}">
  <link href="https://cdn.jsdelivr.net/npm/geist@1.0.0/dist/fonts/geist-sans/style.css" rel="stylesheet">
  <link href="/static/css/app.css?v={{APP_VERSION}}" rel="stylesheet">
  <style>
    body { background:#FAF9F5 }
    .page-hd { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:18px }
    .page-title { font-size:22px; font-weight:700; line-height:1.2 }
    .page-actions { display:flex; gap:8px; align-items:center }
    .mapping-card { background:#fff; border:1px solid #e8e3d8; border-radius:18px; overflow:hidden; box-shadow:0 10px 30px rgba(21,18,14,.05) }
    .mapping-form { display:grid }
    .alias-row { display:grid; grid-template-columns:112px minmax(0,1fr); gap:18px; align-items:start; padding:18px 20px; border-bottom:1px solid #eee7dc; background:linear-gradient(180deg,#fff,#fffdf9) }
    .alias-row:last-child { border-bottom:none }
    .alias-name { display:grid; align-content:center; justify-items:center; gap:2px; min-height:46px; border-radius:14px; background:#111; color:#fff; -webkit-text-fill-color:#fff; font-weight:850; letter-spacing:.06em; box-shadow:inset 0 -1px 0 rgba(255,255,255,.16), 0 8px 18px rgba(17,17,17,.08) }
    .alias-name small { font-size:10px; font-weight:650; letter-spacing:0; opacity:.68 }
    .model-picker { display:grid; gap:12px; min-width:0 }
    .pool-block { display:grid; gap:8px; padding:12px; border:1px solid #e8e1d6; border-radius:14px; background:#fffdf9 }
    .pool-block.is-degraded { background:#fffaf4 }
    .pool-head { display:flex; align-items:center; justify-content:space-between; gap:8px; color:#24201b; font-size:12px; font-weight:800 }
    .pool-head small { color:#8a8174; font-size:11px; font-weight:650 }
    .model-actions { display:grid; grid-template-columns:minmax(260px,520px) auto; align-items:center; gap:8px }
    .model-actions select { width:100%; height:36px; min-width:0; border:1px solid #d8d2c7; border-radius:11px; background:#fff; padding:0 11px; font:inherit; box-shadow:inset 0 1px 0 rgba(255,255,255,.6) }
    .model-actions select:focus { border-color:#111; box-shadow:0 0 0 3px rgba(17,17,17,.06) }
    .ordered-list { display:flex; flex-wrap:wrap; gap:8px; min-height:30px; align-items:center }
    .ordered-item { display:inline-flex; align-items:center; gap:7px; max-width:100%; min-height:30px; padding:0 7px 0 10px; border:1px solid #e6dccd; border-radius:999px; background:#f6f0e7; color:#181511; font-size:12px; font-weight:700; box-shadow:0 1px 0 rgba(255,255,255,.72) }
    .ordered-text { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
    .ordered-item button { flex:0 0 auto; width:18px; height:18px; border-radius:999px; border:1px solid #d9cfbf; background:#e9dfd0; color:#171411; cursor:pointer; line-height:16px; font-weight:800 }
    .ordered-item button:hover { background:#111; border-color:#111; color:#fff; -webkit-text-fill-color:#fff }
    .muted { display:inline-flex; align-items:center; height:30px; color:#8a8174; font-size:12px }
    .status { display:inline-flex; align-items:center; height:28px; padding:0 10px; border:1px solid #eee7dc; border-radius:999px; background:#fffdf9; font-size:12px; color:#766d60; white-space:nowrap }
    .btn-line { height:36px; padding:0 13px; border:1px solid #d8d2c7; border-radius:11px; background:#fff; color:#222; font-weight:700; box-shadow:0 1px 0 rgba(255,255,255,.8) }
    .btn-line:hover { border-color:#111; background:#fffdf8 }
    .btn-line:disabled { opacity:.45; pointer-events:none }
    .btn-primary { height:36px; padding:0 15px; border-radius:11px; background:#111; color:#fff !important; -webkit-text-fill-color:#fff; border:1px solid #111; font-weight:750; box-shadow:0 8px 18px rgba(17,17,17,.08) }
    .btn-primary:hover:not(:disabled) { opacity:.9 }
    .btn-primary:disabled { opacity:.45; pointer-events:none }
    .models-modal { width:min(760px,94vw); max-height:calc(100dvh - 32px); padding:16px; display:flex; flex-direction:column; overflow:hidden }
    .models-modal-head { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px; flex-shrink:0 }
    .models-modal-head .modal-title { margin-bottom:0 }
    .models-modal-table { display:grid; grid-template-rows:auto minmax(0,1fr); min-height:0 }
    .models-modal-head-row, .models-modal-row { display:grid; grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) 70px 140px; gap:10px; align-items:center; padding:8px 10px }
    .models-modal-head-row { color:#8a8174; font-size:11px; font-weight:800; letter-spacing:.03em; border-bottom:1px solid #eee7dc; flex-shrink:0 }
    .models-modal-list { overflow-y:auto; min-height:180px }
    .models-modal-row { border-bottom:1px solid #f3ede3; font-size:13px }
    .models-modal-row:last-child { border-bottom:none }
    .models-modal-id { font-weight:750; color:#181511; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
    .models-modal-name-cell { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:#766d60 }
    .models-modal-pool { display:inline-flex; align-items:center; height:24px; padding:0 8px; border-radius:999px; background:#f6f0e7; color:#5c5348; font-size:11px; font-weight:750 }
    .models-modal-flags { display:flex; flex-wrap:wrap; gap:4px }
    .model-flag { display:inline-flex; align-items:center; height:22px; padding:0 7px; border-radius:999px; background:#f2ede4; color:#6b6256; font-size:11px; font-weight:700 }
    @media (max-width: 760px) {
      .page-hd { align-items:flex-start; flex-direction:column }
      .page-actions { width:100%; flex-wrap:wrap }
      .alias-row { grid-template-columns:1fr }
      .alias-name { justify-content:flex-start; padding:0 12px }
      .model-actions { grid-template-columns:1fr }
      .model-options { grid-template-columns:1fr }
      .models-modal-head-row, .models-modal-row { grid-template-columns:minmax(0,1fr) 70px 132px }
      .models-modal-name-cell { display:none }
    }
  </style>
</head>
<body>
<div id="admin-header" data-active="/admin/model-mapping"></div>

<main class="admin-main" style="padding-bottom:60px">
  <div class="page-hd">
    <div class="page-title">模型映射</div>
    <div class="page-actions">
      <span class="status">稳定 95% · 降级 5% 探测</span>
      <span class="status" id="status">加载中…</span>
      <button class="btn-line" id="models-btn" type="button">可用模型</button>
      <button class="btn-line" id="reset-btn" type="button" disabled>重置</button>
      <button class="btn-line" id="clear-btn" type="button">清空</button>
      <button class="btn-primary" id="save-btn" type="button" disabled>保存</button>
    </div>
  </div>

  <section class="mapping-card">
    <div class="mapping-form" id="mapping-form"></div>
  </section>
</main>

<div class="modal-overlay" id="models-modal" aria-hidden="true">
  <div class="modal models-modal" role="dialog" aria-modal="true" aria-labelledby="models-modal-title">
    <div class="models-modal-head">
      <div class="modal-title" id="models-modal-title">可用模型</div>
      <button type="button" class="btn btn-ghost btn-sm" data-models-close>关闭</button>
    </div>
    <div class="models-modal-table">
      <div class="models-modal-head-row">
        <span>模型 ID</span>
        <span class="models-modal-name-cell">名称</span>
        <span>池</span>
        <span>能力</span>
      </div>
      <div class="models-modal-list" id="models-modal-list"></div>
    </div>
  </div>
</div>

<div id="site-footer"></div>

<script src="/static/js/auth.js?v={{APP_VERSION}}"></script>
<script src="/static/js/i18n.js?v={{APP_VERSION}}"></script>
<script src="/static/js/toast.js?v={{APP_VERSION}}"></script>
<script src="/static/js/admin-header.js?v={{APP_VERSION}}"></script>
<script src="/static/js/footer.js?v={{APP_VERSION}}"></script>
<script>
const VIRTUAL_MODELS = ['FREE', 'SUPER'];
const POOLS = ['stable', 'degraded'];
let adminAuthKey = '';
let allModels = [];
let savedAliases = {};
let draftAliases = {};

function esc(value) {
  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

async function apiFetch(path, options = {}) {
  const headers = { ...(options.headers || {}) };
  if (adminAuthKey) headers.Authorization = `Bearer ${adminAuthKey}`;
  const res = await fetch(`${ADMIN_API}${path}`, { ...options, headers, cache:'no-store' });
  const text = await res.text();
  let body = null;
  try { body = text ? JSON.parse(text) : null; } catch { body = text; }
  if (!res.ok) {
    const message = typeof body === 'string' ? body : (body?.detail || body?.error?.message || res.statusText);
    throw new Error(message);
  }
  return body;
}

function uniqueModels(value) {
  const items = Array.isArray(value) ? value : [];
  return [...new Set(items.map((item) => String(item || '').trim()).filter(Boolean))];
}

function normalizePool(value) {
  if (Array.isArray(value)) {
    return { stable: uniqueModels(value), degraded: [], stable_ratio: 95, degraded_ratio: 5 };
  }
  const source = value && typeof value === 'object' ? value : {};
  const stable = uniqueModels(source.stable);
  return {
    stable,
    degraded: uniqueModels(source.degraded).filter((item) => !stable.includes(item)),
    stable_ratio: Number.isFinite(Number(source.stable_ratio)) ? Number(source.stable_ratio) : 95,
    degraded_ratio: Number.isFinite(Number(source.degraded_ratio)) ? Number(source.degraded_ratio) : 5,
  };
}

function normalizeAliases(value) {
  const source = value && typeof value === 'object' ? value : {};
  const result = {};
  VIRTUAL_MODELS.forEach((name) => { result[name] = normalizePool(source[name]); });
  return result;
}

function sameAliases(a, b) {
  return JSON.stringify(normalizeAliases(a)) === JSON.stringify(normalizeAliases(b));
}

function modelLabel(item) {
  const flags = [];
  if (item.chat) flags.push('chat');
  if (item.console) flags.push('console');
  if (item.image) flags.push('image');
  if (item.image_edit) flags.push('edit');
  if (item.video) flags.push('video');
  return `${item.pool}${flags.length ? ' · ' + flags.join(' · ') : ''}`;
}

function setStatus(text) {
  document.getElementById('status').textContent = text;
}

function modelFlags(item) {
  const flags = [];
  if (item.chat) flags.push('chat');
  if (item.console) flags.push('console');
  if (item.image) flags.push('image');
  if (item.image_edit) flags.push('edit');
  if (item.video) flags.push('video');
  return flags.map((flag) => `<span class="model-flag">${esc(flag)}</span>`).join('');
}

function renderModelRow(item) {
  return `
    <div class="models-modal-row">
      <span class="models-modal-id" title="${esc(item.id)}">${esc(item.id)}</span>
      <span class="models-modal-name-cell" title="${esc(item.name || '')}">${esc(item.name || '—')}</span>
      <span><span class="models-modal-pool">${esc(item.pool)}</span></span>
      <span class="models-modal-flags">${modelFlags(item)}</span>
    </div>`;
}

function openModelsModal() {
  const modal = document.getElementById('models-modal');
  const list = document.getElementById('models-modal-list');
  list.innerHTML = '<span class="muted">加载中…</span>';
  modal.classList.add('open');
  modal.setAttribute('aria-hidden', 'false');
  apiFetch('/model-mapping').then((payload) => {
    const models = payload?.data?.models || [];
    document.getElementById('models-modal-title').textContent = `可用模型 · ${models.length}`;
    list.innerHTML = models.length
      ? models.map(renderModelRow).join('')
      : '<span class="muted">无可用模型</span>';
  }).catch((error) => {
    list.innerHTML = `<span class="muted">${esc(error.message)}</span>`;
  });
}

function closeModelsModal() {
  const modal = document.getElementById('models-modal');
  modal.classList.remove('open');
  modal.setAttribute('aria-hidden', 'true');
}

function syncButtons() {
  const dirty = !sameAliases(savedAliases, draftAliases);
  document.getElementById('save-btn').disabled = !dirty;
  document.getElementById('reset-btn').disabled = !dirty;
  setStatus(dirty ? '存在未保存更改' : '已保存');
}

function removeCandidate(aliasName, poolName, modelId) {
  draftAliases[aliasName][poolName] = (draftAliases[aliasName][poolName] || []).filter((item) => item !== modelId);
  render();
}

function addCandidate(aliasName, poolName) {
  const select = document.getElementById(`select-${aliasName}-${poolName}`);
  const modelId = select.value;
  if (!modelId) return;
  const pool = draftAliases[aliasName];
  const allSelected = [...pool.stable, ...pool.degraded];
  if (!allSelected.includes(modelId)) pool[poolName].push(modelId);
  select.value = '';
  render();
}

function renderPool(aliasName, poolName, label, hint) {
  const pool = draftAliases[aliasName];
  const selected = pool[poolName] || [];
  const selectedSet = new Set([...pool.stable, ...pool.degraded]);
  const selectedHtml = selected.length
    ? selected.map((modelId) => `<span class="ordered-item"><span class="ordered-text">${esc(modelId)}</span><button type="button" aria-label="移除 ${esc(modelId)}" onclick="removeCandidate('${esc(aliasName)}','${esc(poolName)}','${esc(modelId)}')">×</button></span>`).join('')
    : '<span class="muted">未配置模型</span>';
  const options = allModels
    .filter((item) => !selectedSet.has(item.id))
    .map((item) => `<option value="${esc(item.id)}">${esc(item.id)} · ${esc(modelLabel(item))}</option>`)
    .join('');
  return `
    <div class="pool-block ${poolName === 'degraded' ? 'is-degraded' : ''}">
      <div class="pool-head"><span>${label}</span><small>${hint}</small></div>
      <div class="ordered-list">${selectedHtml}</div>
      <div class="model-actions">
        <select id="select-${esc(aliasName)}-${esc(poolName)}">
          <option value="">选择真实模型</option>
          ${options}
        </select>
        <button class="btn-line" type="button" onclick="addCandidate('${esc(aliasName)}','${esc(poolName)}')">添加</button>
      </div>
    </div>`;
}

function renderAlias(aliasName) {
  return `
    <div class="alias-row">
      <div class="alias-name">${esc(aliasName)}<small>模型池</small></div>
      <div class="model-picker">
        ${renderPool(aliasName, 'stable', '稳定池', '95% · 池内轮询')}
        ${renderPool(aliasName, 'degraded', '降级池', '5% · 成功后升级')}
      </div>
    </div>`;
}

function render() {
  document.getElementById('mapping-form').innerHTML = VIRTUAL_MODELS.map(renderAlias).join('');
  syncButtons();
}

async function loadMapping() {
  setStatus('加载中…');
  const payload = await apiFetch('/model-mapping');
  allModels = payload?.data?.models || [];
  savedAliases = normalizeAliases(payload?.data?.aliases);
  draftAliases = normalizeAliases(savedAliases);
  render();
}

async function saveMapping() {
  const aliases = normalizeAliases(draftAliases);
  setStatus('保存中…');
  await apiFetch('/model-mapping', {
    method:'POST',
    headers:{ 'Content-Type':'application/json' },
    body:JSON.stringify({ models:{ aliases } }),
  });
  savedAliases = normalizeAliases(aliases);
  draftAliases = normalizeAliases(aliases);
  render();
  window.showToast?.('模型映射已保存', 'success');
}

async function clearMapping() {
  if (!window.confirm('确定清空 FREE / SUPER 的全部模型映射吗？')) return;
  const aliases = normalizeAliases({});
  setStatus('清空中…');
  await apiFetch('/model-mapping', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ models: { aliases } }),
  });
  savedAliases = normalizeAliases(aliases);
  draftAliases = normalizeAliases(aliases);
  render();
  window.showToast?.('模型映射已清空', 'success');
}

function waitI18n() {
  return new Promise((resolve) => window.I18n?.onReady(resolve) || resolve());
}

(async () => {
  await waitI18n();
  await window.renderAdminHeader?.();
  await window.renderSiteFooter?.();
  adminAuthKey = await adminKey.get();
  if (!adminAuthKey || !await verifyKey(ADMIN_API + '/verify', adminAuthKey).catch(() => false)) {
    location.href = '/admin/login';
    return;
  }
  document.getElementById('save-btn').addEventListener('click', () => saveMapping().catch((error) => {
    setStatus('保存失败');
    window.showToast?.(`保存失败: ${error.message}`, 'error');
  }));
  document.getElementById('reset-btn').addEventListener('click', () => {
    draftAliases = normalizeAliases(savedAliases);
    render();
  });
  document.getElementById('clear-btn').addEventListener('click', () => clearMapping().catch((error) => {
    setStatus('清空失败');
    window.showToast?.(`清空失败: ${error.message}`, 'error');
  }));
  document.getElementById('models-btn').addEventListener('click', openModelsModal);
  document.querySelectorAll('[data-models-close]').forEach((node) => node.addEventListener('click', closeModelsModal));
  document.getElementById('models-modal').addEventListener('click', (event) => {
    if (event.target === event.currentTarget) closeModelsModal();
  });
  document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape') closeModelsModal();
  });
  try {
    await loadMapping();
  } catch (error) {
    setStatus('加载失败');
    document.getElementById('mapping-form').innerHTML = `<span class="muted">${esc(error.message)}</span>`;
    window.showToast?.('模型映射加载失败', 'error');
  }
})();
</script>
</body>
</html>
