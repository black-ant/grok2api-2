<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grok2API - 路由状态</title>
<link rel="icon" href="/favicon.ico?v={{APP_VERSION}}">
<link href="https://cdn.jsdelivr.net/npm/geist@1.0.0/dist/fonts/geist-sans/style.css" rel="stylesheet">
<link href="/static/css/app.css?v={{APP_VERSION}}" rel="stylesheet">
<style>
body{background:#FAF9F5}.page-hd{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.page-title{font-size:22px;font-weight:700;line-height:1.2}.page-actions{display:flex;align-items:center;gap:10px}.route-status{color:#777;font-size:12px;white-space:nowrap}.route-card{background:#fff;border:1px solid #e8e3d8;border-radius:16px;box-shadow:0 1px 2px rgba(15,23,42,.04)}.overview-card{padding:14px}.overview-head,.alias-head,.pool-head,.recent-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.section-title{font-size:14px;font-weight:800;color:#171411}.section-meta{color:#8a8174;font-size:11px;white-space:nowrap}.overview-metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:12px}.metric{min-width:0;padding:12px;border:1px solid #ebe5dc;border-radius:12px;background:#fffdf9}.metric-label{color:#777066;font-size:11px;margin-bottom:5px}.metric-value{color:#171411;font-size:21px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}.ratio-track{display:flex;height:10px;margin-top:14px;overflow:hidden;border-radius:999px;background:#f0ebe2}.ratio-track span{display:block;min-width:0;transition:width .25s ease}.ratio-stable{background:#171411}.ratio-degraded{background:#c98942}.ratio-legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:8px;color:#6e665b;font-size:11px}.ratio-legend span{display:inline-flex;align-items:center;gap:5px}.ratio-dot{width:7px;height:7px;border-radius:50%}.alias-list{display:grid;gap:14px;margin-top:14px}.alias-card{padding:14px}.alias-title{display:flex;align-items:baseline;gap:8px;min-width:0}.alias-name{font-size:17px;font-weight:850;letter-spacing:.03em}.alias-total{color:#8a8174;font-size:12px;font-variant-numeric:tabular-nums}.alias-ratio{display:grid;grid-template-columns:auto minmax(140px,1fr) auto;align-items:center;gap:10px;margin-top:12px;color:#6e665b;font-size:11px}.alias-ratio .ratio-track{width:100%;margin:0}.pool-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}.pool-panel{min-width:0;padding:12px;border:1px solid #e7e0d4;border-radius:12px;background:#fffdf9}.pool-panel.is-degraded{background:#fffaf4}.pool-label{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:800}.pool-mark{width:8px;height:8px;border-radius:50%;background:#171411}.pool-panel.is-degraded .pool-mark{background:#c98942}.pool-target{color:#8a8174;font-size:11px;font-weight:600}.model-list{display:grid;gap:7px;margin-top:10px}.model-row{display:flex;align-items:center;justify-content:space-between;gap:10px;min-width:0;padding:8px 9px;border:1px solid #eee8df;border-radius:9px;background:#fff}.model-name-wrap{display:flex;align-items:center;gap:5px;min-width:0}.model-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#211e1a;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px}.model-copy-btn{display:inline-flex;flex:0 0 auto;align-items:center;justify-content:center;width:20px;height:20px;padding:0;border:0;border-radius:5px;background:transparent;color:#8a8174;cursor:pointer}.model-copy-btn svg{width:13px;height:13px}.model-copy-btn:hover{background:#f3eee6;color:#211e1a}.model-copy-btn:focus-visible{outline:2px solid #c98942;outline-offset:1px}.model-stats{display:flex;flex:0 0 auto;align-items:center;gap:8px;color:#766d60;font-size:11px;font-variant-numeric:tabular-nums}.model-share{color:#171411;font-weight:750}.empty-pool{color:#9a9287;font-size:12px;padding:8px 0 2px}.recent-block{margin-top:12px;padding-top:12px;border-top:1px solid #eee8df}.recent-list{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:9px;min-height:30px}.route-node{display:inline-flex;align-items:center;gap:6px;max-width:100%;min-height:28px;padding:0 9px;border:1px solid #e4ddd2;border-radius:999px;background:#f8f3eb;color:#211e1a;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px}.route-node small{color:#8a8174;font-family:var(--font-sans);font-size:10px}.route-arrow{color:#aaa094;font-size:13px}.pool-event-list{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:9px;min-height:30px}.pool-event-node{display:inline-flex;align-items:center;gap:6px;max-width:100%;min-height:28px;padding:0 9px;border:1px solid #e4ddd2;border-radius:999px;background:#f8f3eb;color:#211e1a;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px}.pool-event-node small{color:#8a8174;font-family:var(--font-sans);font-size:10px}.pool-event-node.is-promote{border-color:#d6e4d2;background:#f4fbf1}.pool-event-node.is-demote{border-color:#eed8bd;background:#fff7ec}.pool-event-action{font-family:var(--font-sans);font-size:10px;font-weight:800}.pool-event-node.is-promote .pool-event-action{color:#2f6f36}.pool-event-node.is-demote .pool-event-action{color:#9a5a18}.empty-card{padding:18px;color:#766d60;font-size:13px}@media(max-width:760px){.page-hd{align-items:flex-start;flex-direction:column}.page-actions{width:100%;justify-content:space-between}.overview-metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.pool-grid{grid-template-columns:1fr}.alias-ratio{grid-template-columns:1fr auto}.alias-ratio .ratio-track{grid-column:1/-1;grid-row:2}}
</style>
</head>
<body>
<div id="admin-header" data-active="/admin/model-routing"></div>
<main class="admin-main" style="padding-bottom:60px">
<div class="page-hd"><div class="page-title">路由状态</div><div class="page-actions"><span class="route-status" id="route-status">读取中…</span><button type="button" class="btn btn-primary" id="refresh-btn">刷新</button></div></div>
<section class="route-card overview-card" aria-labelledby="overview-title">
<div class="overview-head"><div class="section-title" id="overview-title">整体路由</div><div class="section-meta" id="generated-at">—</div></div>
<div class="overview-metrics"><div class="metric"><div class="metric-label">目标稳定池</div><div class="metric-value">95%</div></div><div class="metric"><div class="metric-label">实际稳定池</div><div class="metric-value" id="overall-stable-share">0%</div></div><div class="metric"><div class="metric-label">实际降级池</div><div class="metric-value" id="overall-degraded-share">0%</div></div><div class="metric"><div class="metric-label">真实请求</div><div class="metric-value" id="overall-total">0</div></div></div>
<div class="ratio-track" aria-label="整体实际路由比例"><span class="ratio-stable" id="overall-stable-bar" style="width:100%"></span><span class="ratio-degraded" id="overall-degraded-bar" style="width:0%"></span></div>
<div class="ratio-legend"><span><i class="ratio-dot ratio-stable"></i>稳定池 95% 目标</span><span><i class="ratio-dot ratio-degraded"></i>降级池 5% 探测</span><span>统计范围：当前进程；重启或保存配置后重置</span></div>
</section>
<section id="alias-list" class="alias-list" aria-live="polite"></section><section class="route-card empty-card" id="empty-card" hidden>暂无已配置的虚拟模型。</section>
</main>
<div id="site-footer"></div>
<script src="/static/js/auth.js?v={{APP_VERSION}}"></script><script src="/static/js/i18n.js?v={{APP_VERSION}}"></script><script src="/static/js/toast.js?v={{APP_VERSION}}"></script><script src="/static/js/admin-header.js?v={{APP_VERSION}}"></script><script src="/static/js/footer.js?v={{APP_VERSION}}"></script>
<script>
let adminAuthKey='';let refreshTimer=0;let loading=false;function esc(value){return String(value??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function percent(value){const number=Number(value);return Number.isFinite(number)?`${number.toFixed(number%1?1:0)}%`:'0%'}
function width(value){const number=Number(value);return Number.isFinite(number)?Math.max(0,Math.min(100,number)):0}
function formatTime(value){const number=Number(value);if(!Number.isFinite(number))return'—';const date=new Date(number<100000000000?number*1000:number);return Number.isNaN(date.getTime())?'—':date.toLocaleTimeString('zh-CN',{hour12:false})}
 function formatModel(model,statsByModel){const item=statsByModel.get(model)||{};return`<div class="model-row"><span class="model-name-wrap"><span class="model-name" title="${esc(model)}">${esc(model)}</span><button type="button" class="model-copy-btn" data-copy-model="${esc(model)}" title="复制模型名" aria-label="复制模型名"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="9" y="9" width="10" height="10" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M7 15H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h7a2 2 0 0 1 2 2v1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button></span><span class="model-stats"><span>${Number(item.requests||0)} 次</span><span class="model-share">${percent(item.share)}</span></span></div>`}
function formatPool(poolName,models,statsByModel,target){const label=poolName==='stable'?'稳定池':'降级池';const empty='<div class="empty-pool">暂无模型</div>';return`<section class="pool-panel ${poolName==='degraded'?'is-degraded':''}"><div class="pool-head"><div class="pool-label"><i class="pool-mark"></i>${label}</div><div class="pool-target">${percent(target)} 目标</div></div><div class="model-list">${models.length?models.map(model=>formatModel(model,statsByModel)).join(''):empty}</div></section>`}
 async function copyText(text){if(navigator.clipboard?.writeText)return navigator.clipboard.writeText(text);const area=document.createElement('textarea');area.value=text;area.setAttribute('readonly','');area.style.position='fixed';area.style.opacity='0';document.body.appendChild(area);area.select();const copied=document.execCommand('copy');area.remove();if(!copied)throw new Error('copy failed')}
 async function copyModel(model){try{await copyText(model);showToast('已复制','success')}catch{showToast('复制失败','error')}}
 function formatRecent(routes){if(!routes.length)return'<span class="empty-pool">暂无真实请求</span>';return routes.slice().reverse().map((route,index)=>`${index?'<span class="route-arrow" aria-hidden="true">→</span>':''}<span class="route-node" title="${esc(formatTime(route.at))}">${esc(route.model)}<small>${route.pool==='degraded'?'降级':'稳定'}</small></span>`).join('')}
function poolLabel(pool){return pool==='stable'?'稳定':'降级'}
function formatPoolEvents(events){if(!events.length)return'<span class="empty-pool">暂无升降级</span>';return events.slice().reverse().map(event=>{const promote=event.action==='promote';return`<span class="pool-event-node ${promote?'is-promote':'is-demote'}" title="${esc(formatTime(event.at))}"><span class="pool-event-action">${promote?'升级':'降级'}</span>${esc(event.model)}<small>${poolLabel(event.from_pool)} → ${poolLabel(event.to_pool)}</small></span>`}).join('')}
function renderAlias(alias){const stats=alias.stats||{};const stable=alias.effective?.stable||[];const degraded=alias.effective?.degraded||[];const statsByModel=new Map((alias.models||[]).map(item=>[item.id,item]));const target=alias.target||{stable:95,degraded:5};const stableShare=Number(stats.stable_share||0);const degradedShare=Number(stats.degraded_share||0);return`<article class="route-card alias-card"><div class="alias-head"><div class="alias-title"><span class="alias-name">${esc(alias.name)}</span><span class="alias-total">${Number(stats.total||0)} 次真实请求</span></div><div class="section-meta">实际 ${percent(stableShare)} / ${percent(degradedShare)}</div></div><div class="alias-ratio"><span>稳定 / 降级</span><div class="ratio-track" aria-label="${esc(alias.name)} 实际路由比例"><span class="ratio-stable" style="width:${width(stableShare)}%"></span><span class="ratio-degraded" style="width:${width(degradedShare)}%"></span></div><span>目标 ${percent(target.stable)} / ${percent(target.degraded)}</span></div><div class="pool-grid">${formatPool('stable',stable,statsByModel,target.stable)}${formatPool('degraded',degraded,statsByModel,target.degraded)}</div><div class="recent-block"><div class="recent-head"><div class="section-title">最近实际路由</div><div class="section-meta">最多 30 次，从旧到新</div></div><div class="recent-list">${formatRecent(alias.recent||[])}</div></div><div class="recent-block"><div class="recent-head"><div class="section-title">升降级记录</div><div class="section-meta">最近 50 条，从旧到新</div></div><div class="pool-event-list">${formatPoolEvents(alias.pool_events||[])}</div></div></article>`}function renderRouting(payload){const aliases=payload?.data?.aliases||[];document.getElementById('empty-card').hidden=aliases.length>0;document.getElementById('alias-list').innerHTML=aliases.map(renderAlias).join('');const totals=aliases.reduce((result,alias)=>{const stats=alias.stats||{};result.total+=Number(stats.total||0);result.stable+=Number(stats.stable||0);result.degraded+=Number(stats.degraded||0);return result},{total:0,stable:0,degraded:0});const stableShare=totals.total?totals.stable*100/totals.total:0;const degradedShare=totals.total?totals.degraded*100/totals.total:0;document.getElementById('overall-total').textContent=String(totals.total);document.getElementById('overall-stable-share').textContent=percent(stableShare);document.getElementById('overall-degraded-share').textContent=percent(degradedShare);document.getElementById('overall-stable-bar').style.width=`${width(stableShare)}%`;document.getElementById('overall-degraded-bar').style.width=`${width(degradedShare)}%`;document.getElementById('generated-at').textContent=`更新 ${formatTime(payload?.data?.generated_at)}`}
async function apiFetch(path){const headers=adminAuthKey?{Authorization:`Bearer ${adminAuthKey}`}:{ };const response=await fetch(`${ADMIN_API}${path}`,{headers,cache:'no-store'});const text=await response.text();let body=null;try{body=text?JSON.parse(text):null}catch{body=text}if(!response.ok){const message=typeof body==='string'?body:(body?.detail||body?.error?.message||response.statusText);throw new Error(message)}return body}
async function loadRouting(){if(loading)return;loading=true;try{renderRouting(await apiFetch('/model-routing'));document.getElementById('route-status').textContent='自动刷新中 · 最近成功读取'}catch(error){document.getElementById('route-status').textContent=`读取失败：${error.message}`}finally{loading=false}}
function waitI18n(){return new Promise(resolve=>window.I18n?.onReady(resolve)||resolve())}
 (async()=>{await waitI18n();await window.renderAdminHeader?.();await window.renderSiteFooter?.();adminAuthKey=await adminKey.get();if(!adminAuthKey||!await verifyKey(ADMIN_API+'/verify',adminAuthKey).catch(()=>false)){location.href='/admin/login';return}document.getElementById('refresh-btn').addEventListener('click',()=>loadRouting());document.getElementById('alias-list').addEventListener('click',event=>{const button=event.target.closest('[data-copy-model]');if(button)copyModel(button.dataset.copyModel)});await loadRouting();refreshTimer=window.setInterval(loadRouting,2000)})();
window.addEventListener('beforeunload',()=>{if(refreshTimer)window.clearInterval(refreshTimer)});
</script>
</body>
</html>
