<!DOCTYPE html>
<html lang='zh-CN'>
<head>
  <meta charset='UTF-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1.0'>
  <title>Grok2API - Clash代理</title>
  <link rel='icon' href='/favicon.ico?v={{APP_VERSION}}'>
  <link href='https://cdn.jsdelivr.net/npm/geist@1.0.0/dist/fonts/geist-sans/style.css' rel='stylesheet'>
  <link href='/static/css/app.css?v={{APP_VERSION}}' rel='stylesheet'>
  <style>
    body { background:#FAF9F5 }
    .clash-main { max-width:1040px; padding-bottom:48px }
    .clash-pool-table { min-width:980px }
    .clash-pool-table tr.is-disabled td { color:#aaa49c; background:#fcfbf9 }
    .clash-pool-kernel { color:#554d43; font-size:11px }
    .clash-modal { width:min(980px, calc(100vw - 48px)); max-height:min(90vh, 860px); padding:0; overflow:hidden; display:flex; flex-direction:column }
    .clash-modal-head { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:18px 20px 14px; border-bottom:1px solid #eeeae2 }
    .clash-modal-head .modal-title { margin:0; color:#27231f }
    .clash-modal-close { width:32px; height:32px; display:inline-flex; align-items:center; justify-content:center; border:1px solid #e6e1d8; border-radius:8px; background:#fff; color:#777066; cursor:pointer }
    .clash-modal-close:hover { background:#fbfaf7; color:#27231f }
    .clash-modal-close svg { width:16px; height:16px }
    .clash-modal-body { min-height:0; overflow:auto; padding:18px 20px 20px }
    .clash-modal .clash-panel { padding:0; border:0; border-radius:0; background:transparent }
    .clash-modal .clash-yaml { min-height:320px }
    .clash-modal .clash-table-wrap { max-height:360px }
    .clash-modal .clash-selection-bar { align-items:flex-end }
    .page-hd { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:18px }
    .page-title { font-size:22px; font-weight:700; line-height:1.2 }
    .page-sub { margin-top:5px; color:var(--fg-muted); font-size:13px }
    .clash-status { min-height:28px; padding:0 11px; border-radius:999px; display:inline-flex; align-items:center; flex:0 0 auto; background:#f1f1f1; color:#777; font-size:12px; font-weight:600 }
    .clash-status.is-on { background:#eaf8ef; color:#14803c }
    .clash-current { display:flex; align-items:center; justify-content:space-between; gap:14px; margin-bottom:16px; padding:12px 14px; border:1px solid #ece8df; border-radius:12px; background:#fff }
    .clash-current-main { min-width:0; display:flex; align-items:center; gap:10px; font-size:13px }
    .clash-current-label { color:#888; font-size:12px }
    .clash-current-name { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:600; color:#27231f }
    .clash-current-scope { color:#8b857b; font-size:12px }
    .clash-steps { display:flex; align-items:center; gap:8px; margin-bottom:12px; color:#a29b90; font-size:12px; font-weight:600 }
    .clash-step { display:inline-flex; align-items:center; gap:6px; padding:0 3px }
    .clash-step-index { width:22px; height:22px; display:inline-flex; align-items:center; justify-content:center; border-radius:50%; background:#e9e5dd; color:#80796e; font-size:11px }
    .clash-step.is-active { color:#25211d }
    .clash-step.is-active .clash-step-index { background:#111; color:#fff }
    .clash-step-line { width:28px; height:1px; background:#e2ddd4 }
    .clash-panel { padding:18px; border:1px solid #ece8df; border-radius:14px; background:#fff }
    .clash-panel-head { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:10px }
    .clash-panel-head-actions { display:flex; align-items:center; gap:8px }
    .clash-panel-title { color:#27231f; font-size:13px; font-weight:700 }
    .clash-count { color:#8d877d; font-size:12px }
    .clash-yaml { width:100%; min-height:360px; padding:12px; resize:vertical; border:1px solid #e6e1d8; border-radius:10px; background:#fbfaf7; color:#302b26; font:12px/1.6 ui-monospace, SFMono-Regular, Consolas, monospace }
    .clash-yaml:focus { outline:none; border-color:#aaa296; box-shadow:0 0 0 3px rgba(84,73,60,.08) }
    .clash-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:12px }
    .clash-btn-danger { border:1px solid #f0caca; background:#fff7f7; color:#b42318 }
    .clash-btn-danger:hover { background:#fff0f0 }
    .clash-btn-danger:disabled { opacity:.45; cursor:default }
    .clash-table-wrap { overflow:auto; border:1px solid #eeeae2; border-radius:10px }
    .clash-table { width:100%; min-width:900px; border-collapse:collapse; table-layout:fixed }
    .clash-table th { padding:10px 12px; background:#fbfaf7; color:#928b80; font-size:11px; font-weight:600; text-align:left; white-space:nowrap }
    .clash-table td { padding:11px 12px; border-top:1px solid #f1eee8; color:#39332d; font-size:12px; vertical-align:middle }
    .clash-table tr.is-disabled td { color:#aaa49c; background:#fcfbf9 }
    .clash-table tr.is-selected td { background:#f7f5f0 }
    .clash-table tr.is-in-pool td { background:#f2faf4 }
    .clash-choice { display:flex; align-items:center; gap:9px; min-width:0; cursor:pointer }
    .clash-choice input { width:15px; height:15px; accent-color:#111; flex:0 0 auto }
    .clash-node-name { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:600 }
    .clash-muted { color:#aaa49c !important }
    .clash-reason { color:#b45309; font-size:11px }
    .clash-speed { display:inline-flex; align-items:center; gap:5px; white-space:nowrap; font-size:11px }
    .clash-speed.is-alive { color:#14803c }
    .clash-speed.is-dead { color:#b42318 }
    .clash-speed.is-pending { color:#8d877d }
    .clash-speed.is-unavailable { color:#b45309 }
    .clash-pool-mark { display:inline-flex; margin-left:6px; padding:2px 6px; border-radius:999px; background:#eaf8ef; color:#14803c; font-size:10px; font-weight:600; vertical-align:middle }
    .clash-selection-bar { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:12px; color:#8d877d; font-size:12px }
    .clash-selection-bar .clash-actions { margin-top:0 }
    .clash-test-button { border:1px solid #e6e1d8; background:#fbfaf7; color:#554d43 }
    .clash-test-button:hover { background:#f3f0e9 }
    .clash-test-button:disabled { opacity:.5; cursor:default }
    .clash-empty { padding:32px 12px; color:#8d877d; text-align:center; font-size:13px }
    .clash-kernel-box { margin-top:14px; padding-top:14px; border-top:1px solid #f1eee8 }
    .clash-kernel-head { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:9px }
    .clash-kernel-title { color:#27231f; font-size:13px; font-weight:700 }
    .clash-kernel-list { display:flex; flex-wrap:wrap; gap:8px }
    .clash-kernel-option { display:inline-flex; align-items:center; gap:8px; min-height:34px; padding:0 10px; border:1px solid #e6e1d8; border-radius:9px; background:#fbfaf7; color:#39332d; font-size:12px; cursor:pointer }
    .clash-kernel-option.is-disabled { color:#aaa49c; cursor:default }
    .clash-kernel-option input { accent-color:#111 }
    .clash-kernel-state { color:#8d877d; font-size:11px }
    .clash-kernel-ready { color:#14803c }
    .clash-kernel-download { margin-left:3px; padding:2px 6px; border:1px solid #ddd6cb; border-radius:6px; background:#fff; color:#554d43; font-size:11px; cursor:pointer }
    .clash-kernel-download:disabled { opacity:.5; cursor:default }
    @media (max-width:640px) {
      .page-hd, .clash-current { align-items:flex-start; flex-direction:column }
      .clash-status { align-self:flex-start }
      .clash-current { gap:10px }
      .clash-current-main { width:100% }
      .clash-panel { padding:12px }
      .clash-yaml { min-height:300px }
      .clash-actions { justify-content:stretch }
      .clash-actions .btn { flex:1 }
      #clash-import-modal { padding:0 }
      .clash-modal { width:100%; max-height:100vh; height:100%; border-radius:0 }
      .clash-modal-head, .clash-modal-body { padding-left:12px; padding-right:12px }
      .clash-modal .clash-selection-bar { align-items:stretch; flex-direction:column }
    }
  </style>
</head>

<div id='admin-header' data-active='/admin/clash'></div>

<main class='admin-main clash-main'>
  <div class='page-hd'>
    <div class='page-title'>Clash代理</div>
    <div id='clash-status' class='clash-status'>未启用</div>
  </div>

  <div id='clash-current' class='clash-current'>
    <div class='clash-current-main'>
      <span class='clash-current-label'>当前节点</span>
      <strong id='clash-current-name' class='clash-current-name'>未启用</strong>
      <span class='clash-current-scope'>全局</span>
    </div>
    <button id='clash-disable' class='btn clash-btn-danger' type='button' hidden>关闭代理</button>
  </div>

  <section id='clash-pool-panel' class='clash-panel'>
    <div class='clash-panel-head'>
      <div>
        <div class='clash-panel-title'>代理池</div>
        <span id='clash-pool-count' class='clash-count'></span>
      </div>
      <div class='clash-panel-head-actions'>
        <button id='clash-pool-test' class='btn clash-test-button' type='button'>测速</button>

        <thead><tr><th style='width:26%'>节点</th><th style='width:11%'>类型</th><th style='width:22%'>服务器</th><th style='width:9%'>端口</th><th style='width:13%'>代理内核</th><th style='width:9%'>状态</th><th style='width:10%'>延迟</th></tr></thead>

    <div class='clash-modal-head'>

      <button id='clash-modal-close' class='clash-modal-close' type='button' aria-label='关闭'>
        <svg viewBox='0 0 20 20' aria-hidden='true'><path d='M5 5l10 10M15 5L5 15' fill='none' stroke='currentColor' stroke-width='1.6' stroke-linecap='round'/></svg>
      </button>
    </div>
    <div class='clash-modal-body'>
      <div class='clash-steps' aria-label='Clash导入流程'>
        <div id='step-label-1' class='clash-step is-active'><span class='clash-step-index'>1</span><span>录入 YAML</span></div>
        <span class='clash-step-line'></span>
        <div id='step-label-2' class='clash-step'><span class='clash-step-index'>2</span><span>选择节点</span></div>
      </div>

      <section id='clash-input-step' class='clash-panel'>
        <div class='clash-panel-head'>
          <div class='clash-panel-title'>Clash YAML</div>
          <span class='clash-count'>仅解析 proxies</span>
        </div>
        <textarea id='clash-yaml' class='clash-yaml' spellcheck='false' placeholder='proxies:
  - name: 节点名称
    type: socks5
    server: 127.0.0.1
    port: 7891'></textarea>
        <div class='clash-actions'>
          <button id='clash-cancel-input' class='btn btn-ghost' type='button'>取消</button>
          <button id='clash-parse' class='btn btn-primary' type='button'>解析代理</button>
        </div>

      <section id='clash-select-step' class='clash-panel' hidden>
        <div class='clash-panel-head'>
          <div class='clash-panel-title'>选择加入代理池的节点</div>
          <span id='clash-count' class='clash-count'></span>
        </div>
        <div class='clash-table-wrap'>
          <table class='clash-table'>
            <thead><tr><th style='width:31%'>节点</th><th style='width:13%'>类型</th><th style='width:23%'>服务器</th><th style='width:11%'>端口</th><th style='width:11%'>状态</th><th style='width:11%'>延迟</th></tr></thead>

        <div class='clash-kernel-box'>

          <div id='clash-kernel-list' class='clash-kernel-list'></div>
        </div>
      </section>
    </div>
  </div>
</div>

<script src='/static/js/i18n.js?v={{APP_VERSION}}'></script>
<script src='/static/js/auth.js?v={{APP_VERSION}}'></script>
<script src='/static/js/admin-header.js?v={{APP_VERSION}}'></script>
<script src='/static/js/toast.js?v={{APP_VERSION}}'></script>
<script src='/static/js/footer.js?v={{APP_VERSION}}'></script>
<script>
const state = {
  enabled: false,
  yaml: '',
  selectedName: '',
  selectedKernel: 'auto',
  kernels: [],
  proxies: [],
  poolIds: [],
  selectedIds: [],
  testing: false,
  testingIds: [],
};

const poolState = {
  enabled: false,
  yaml: '',
  selectedName: '',
  selectedKernel: 'auto',
  kernels: [],
  proxies: [],
  poolProxies: [],
  poolIds: [],
  testing: false,
  testingIds: [],
};

const yamlInput = document.getElementById('clash-yaml');
const parseButton = document.getElementById('clash-parse');
const testButton = document.getElementById('clash-test');
const applyButton = document.getElementById('clash-apply');
const disableButton = document.getElementById('clash-disable');
const openImportButton = document.getElementById('clash-open-import');
const poolTestButton = document.getElementById('clash-pool-test');
const importModal = document.getElementById('clash-import-modal');
const modalCloseButton = document.getElementById('clash-modal-close');
const cancelInputButton = document.getElementById('clash-cancel-input');
const inputStep = document.getElementById('clash-input-step');
const selectStep = document.getElementById('clash-select-step');
const rows = document.getElementById('clash-proxy-rows');
const poolRows = document.getElementById('clash-pool-rows');
const poolCountLabel = document.getElementById('clash-pool-count');
const countLabel = document.getElementById('clash-count');
const selectionSummary = document.getElementById('clash-selection-summary');
const kernelList = document.getElementById('clash-kernel-list');
const kernelHint = document.getElementById('clash-kernel-hint');

function escapeHtml(value) {
  return String(value ?? '')
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll(String.fromCharCode(39), '&#39;');
}

async function callApi(method, path, body) {
  const key = await adminKey.get();
  const headers = { 'Content-Type': 'application/json' };
  if (key) headers.Authorization = `Bearer ${key}`;
  const response = await fetch(ADMIN_API + path, {
    method,
    headers,
    body: body === undefined ? undefined : JSON.stringify(body),
    cache: 'no-store',
  });
  const payload = await response.json().catch(() => ({}));
  if (!response.ok) {
    throw new Error(payload?.error?.message || payload?.detail || '请求失败');
  }
  return payload;
}

async function streamApi(method, path, body, onEvent) {
  const key = await adminKey.get();
  const headers = { 'Content-Type': 'application/json' };
  if (key) headers.Authorization = `Bearer ${key}`;
  const response = await fetch(ADMIN_API + path, {
    method,
    headers,
    body: body === undefined ? undefined : JSON.stringify(body),
    cache: 'no-store',
  });
  if (!response.ok) {
    const payload = await response.json().catch(() => ({}));
    throw new Error(payload?.error?.message || payload?.detail || '请求失败');
  }
  if (!response.body) throw new Error('浏览器不支持测速流');

  const reader = response.body.getReader();
  const decoder = new TextDecoder();
  let buffer = '';
  const consumeFrame = frame => {
    const data = frame
      .split(/\r?\n/)
      .filter(line => line.startsWith('data:'))
      .map(line => line.slice(5).trimStart())
      .join('\n');
    if (data) onEvent(JSON.parse(data));
  };
  while (true) {
    const { value, done } = await reader.read();
    buffer += decoder.decode(value || new Uint8Array(), { stream: !done });
    const frames = buffer.split(/\r?\n\r?\n/);
    buffer = frames.pop() || '';
    frames.forEach(consumeFrame);
    if (done) break;
  }
  if (buffer.trim()) consumeFrame(buffer);
}

function openImportModal() {
  resetDraftFromPool();
  setStep(1);
  importModal.classList.add('open');
  importModal.setAttribute('aria-hidden', 'false');
  window.setTimeout(() => yamlInput.focus(), 0);
}

function closeImportModal() {
  if (state.testing) {
    showToast('测速进行中，请等待完成', 'info');
    return;
  }
  importModal.classList.remove('open');
  importModal.setAttribute('aria-hidden', 'true');
}

function setStep(step) {
  const selecting = step === 2;
  inputStep.hidden = selecting;
  selectStep.hidden = !selecting;
  document.getElementById('step-label-1').classList.toggle('is-active', !selecting);
  document.getElementById('step-label-2').classList.toggle('is-active', selecting);
}

function cloneProxy(proxy) {
  return { ...proxy, speed: proxy.speed ? { ...proxy.speed } : {} };
}

function applyPoolPayload(payload) {
  poolState.enabled = !!payload.enabled;
  poolState.yaml = payload.committed_yaml || poolState.yaml;
  poolState.proxies = Array.isArray(payload.committed_proxies)
    ? payload.committed_proxies.map(cloneProxy)
    : poolState.proxies;
  const poolProxies = Array.isArray(payload.pool_proxies)
    ? payload.pool_proxies
    : poolState.proxies.filter(proxy => payload.pool_proxy_ids?.includes(proxy.id));
  poolState.poolProxies = poolProxies.map(cloneProxy);
  poolState.poolIds = Array.isArray(payload.pool_proxy_ids) ? [...payload.pool_proxy_ids] : poolState.poolIds;
  poolState.selectedName = payload.selected_proxy_name || poolState.selectedName;
  poolState.selectedKernel = payload.selected_kernel || poolState.selectedKernel;
  poolState.kernels = Array.isArray(payload.kernels) ? payload.kernels.map(item => ({ ...item })) : poolState.kernels;
}

function applyDraftPayload(payload) {
  state.yaml = payload.yaml || state.yaml;
  state.proxies = Array.isArray(payload.proxies) ? payload.proxies.map(cloneProxy) : state.proxies;
  state.poolIds = Array.isArray(payload.pool_proxy_ids) ? [...payload.pool_proxy_ids] : state.poolIds;
  state.selectedName = payload.selected_proxy_name || state.selectedName;
  state.selectedKernel = payload.selected_kernel || state.selectedKernel;
  state.kernels = Array.isArray(payload.kernels) ? payload.kernels.map(item => ({ ...item })) : state.kernels;
  yamlInput.value = state.yaml;
}

function resetDraftFromPool() {
  state.yaml = poolState.yaml;
  state.proxies = poolState.proxies.map(cloneProxy);
  state.poolIds = [...poolState.poolIds];
  state.selectedIds = state.poolIds.filter(proxyId => state.proxies.some(proxy => proxy.id === proxyId && proxy.supported));
  state.selectedName = poolState.selectedName;
  state.selectedKernel = poolState.selectedKernel;
  state.kernels = poolState.kernels.map(item => ({ ...item }));
  state.testing = false;
  state.testingIds = [];
  yamlInput.value = state.yaml;
}

function renderStatus() {
  const status = document.getElementById('clash-status');
  const currentName = document.getElementById('clash-current-name');
  status.textContent = poolState.enabled ? '已启用' : '未启用';
  status.classList.toggle('is-on', poolState.enabled);
  const poolName = poolState.poolIds.length > 1
    ? `代理池（${poolState.poolIds.length} 个节点）`
    : poolState.selectedName || '已启用';
  currentName.textContent = poolState.enabled ? poolName : '未启用';
  disableButton.hidden = !poolState.enabled;
  disableButton.disabled = false;
  disableButton.title = poolState.enabled ? '关闭全局 Clash 代理' : '';
}

function selectedProxies() {
  return state.proxies.filter(proxy => state.selectedIds.includes(proxy.id));
}

function selectedKernelSpec(kernel) {
  return state.kernels.find(item => item.kernel === kernel) || null;
}

function availableKernels() {
  const selected = selectedProxies().filter(proxy => proxy.supported);
  if (!selected.length) return [];
  const tunneled = selected.filter(proxy => !(proxy.kernels || []).includes('native'));
  if (!tunneled.length) return ['auto', 'native'];
  const common = ['xray', 'sing-box', 'mihomo'].filter(kernel =>
    tunneled.every(proxy => (proxy.kernels || []).includes(kernel)),
  );
  return ['auto', ...common];
}

function syncSelectedKernel() {
  const choices = availableKernels();
  if (!choices.length) {
    state.selectedKernel = 'auto';
    return;
  }
  if (choices.includes(state.selectedKernel)) return;
  state.selectedKernel = choices.find(kernel =>
    kernel === 'auto' || kernel === 'native' || selectedKernelSpec(kernel)?.installed,
  ) || choices[0];
}

function updateApplyButton() {
  const selected = selectedProxies();
  const choices = availableKernels();
  const supported = selected.length > 0 && selected.every(proxy => proxy.supported);
  let kernelReady = choices.includes(state.selectedKernel);
  if (kernelReady && state.selectedKernel !== 'auto' && state.selectedKernel !== 'native') {
    kernelReady = selected
      .filter(proxy => !(proxy.kernels || []).includes('native'))
      .every(proxy => selectedKernelSpec(state.selectedKernel)?.installed);
  }
  applyButton.disabled = state.testing || !supported || !kernelReady;
}

function renderKernels() {
  syncSelectedKernel();
  const choices = availableKernels();
  if (!choices.length) {
    kernelHint.textContent = '先勾选节点';
    kernelList.innerHTML = '';
    updateApplyButton();
    return;
  }
  kernelHint.textContent = choices.includes('auto')
    ? '自动选择每个节点可用的内核'
    : '所选节点没有共同内核';
  kernelList.innerHTML = choices.map(kernel => {
    if (kernel === 'auto') {
      return `<label class='clash-kernel-option'><input type='radio' name='clash-kernel' value='auto'${state.selectedKernel === 'auto' ? ' checked' : ''}><span>自动选择</span><span class='clash-kernel-state clash-kernel-ready'>推荐</span></label>`;
    }
    if (kernel === 'native') {
      return `<label class='clash-kernel-option'><input type='radio' name='clash-kernel' value='native'${state.selectedKernel === 'native' ? ' checked' : ''}><span>原生</span><span class='clash-kernel-state clash-kernel-ready'>可用</span></label>`;
    }
    const spec = selectedKernelSpec(kernel);
    const installed = !!spec?.installed;
    const checked = state.selectedKernel === kernel ? ' checked' : '';
    const disabled = installed ? '' : ' disabled';
    const action = installed
      ? `<span class='clash-kernel-state clash-kernel-ready'>已准备</span>`
      : `<button type='button' class='clash-kernel-download' data-kernel='${escapeHtml(kernel)}'>准备</button>`;
    return `<label class='clash-kernel-option${installed ? '' : ' is-disabled'}'><input type='radio' name='clash-kernel' value='${escapeHtml(kernel)}'${checked}${disabled}><span>${escapeHtml(spec?.name || kernel)}</span>${action}</label>`;
  }).join('');
  updateApplyButton();
}

function speedState(proxy, testingIds = state.testingIds) {
  if (testingIds.includes(proxy.id)) {
    return `<span class='clash-speed is-pending'>测速中…</span>`;
  }
  const speed = proxy.speed || {};
  if (speed.state === 'alive') {
    return `<span class='clash-speed is-alive'>在线</span>`;
  }
  if (speed.state === 'unavailable') {
    return `<span class='clash-speed is-unavailable'>内核未准备</span>`;
  }
  if (speed.state === 'unsupported') {
    return `<span class='clash-speed is-pending'>不支持</span>`;
  }
  if (speed.state === 'dead') {
    return `<span class='clash-speed is-dead'>失败</span>`;
  }
  return `<span class='clash-speed is-pending'>未测速</span>`;
}

function speedLatency(proxy) {
  const speed = proxy.speed || {};
  if (speed.state === 'alive' && speed.latency_ms != null) {
    return `${escapeHtml(speed.latency_ms)} ms`;
  }
  if (speed.state === 'dead' || speed.state === 'unavailable') {
    return escapeHtml(speed.error || '-');
  }
  return '-';
}

function renderPoolRows() {
  poolCountLabel.textContent = `${poolState.poolIds.length} 个节点`;
  if (!poolState.poolProxies.length) {
    poolRows.innerHTML = `<tr><td colspan='7' class='clash-empty'>代理池暂无节点，请点击“导入节点”</td></tr>`;
    poolTestButton.disabled = true;
    return;
  }
  poolRows.innerHTML = poolState.poolProxies.map(proxy => {
    const disabled = !proxy.supported;
    return `<tr class='${disabled ? 'is-disabled' : ''}'>
      <td><span class='clash-node-name'>${escapeHtml(proxy.name)}</span>${disabled ? `<div class='clash-reason'>${escapeHtml(proxy.reason)}</div>` : ''}</td>
      <td>${escapeHtml(proxy.type)}</td>
      <td>${escapeHtml(proxy.server)}</td>
      <td>${escapeHtml(proxy.port || '-')}</td>
      <td><span class='clash-pool-kernel'>${escapeHtml(proxy.pool_kernel || '自动')}</span></td>
      <td>${speedState(proxy, poolState.testingIds)}</td>
      <td>${speedLatency(proxy)}</td>
    </tr>`;
  }).join('');
  poolTestButton.disabled = poolState.testing || !poolState.poolProxies.some(proxy => proxy.supported);
}

async function testPoolProxies() {
  const proxyIds = poolState.poolProxies.filter(proxy => proxy.supported).map(proxy => proxy.id);
  if (!proxyIds.length || poolState.testing) return;
  const initialPoolCount = poolState.poolIds.length;
  poolState.testing = true;
  poolState.testingIds = [...proxyIds];
  poolTestButton.disabled = true;
  poolTestButton.textContent = `测速中… 0/${proxyIds.length}`;
  renderPoolRows();
  let streamDone = false;
  try {
    await streamApi('POST', '/proxy/clash/test/stream', {
      proxy_ids: proxyIds,
      formal_pool: true,
    }, event => {
      if (event.type === 'result') {
        const proxy = poolState.poolProxies.find(item => item.id === event.proxy_id);
        if (proxy) proxy.speed = event.result || {};
        poolState.testingIds = poolState.testingIds.filter(proxyId => proxyId !== event.proxy_id);
        const completed = Number(event.completed) || (proxyIds.length - poolState.testingIds.length);
        const total = Number(event.total) || proxyIds.length;
        poolTestButton.textContent = `测速中… ${completed}/${total}`;
        renderPoolRows();
        return;
      }
      if (event.type === 'done') {
        streamDone = true;
        if (event.state) applyPoolPayload(event.state);
        renderStatus();
        renderPoolRows();
        return;
      }
      if (event.type === 'error') {
        throw new Error(event.message || '测速失败');
      }
    });
    if (!streamDone) throw new Error('测速流意外结束');
    const removedCount = Math.max(0, initialPoolCount - poolState.poolIds.length);
    showToast(
      removedCount ? `测速完成，已自动关闭 ${removedCount} 个失败节点` : '测速完成，代理池节点均在线',
      removedCount ? 'info' : 'success',
    );
  } catch (error) {
    showToast(error.message || '测速失败', 'error');
  } finally {
    poolState.testing = false;
    poolState.testingIds = [];
    poolTestButton.disabled = false;
    poolTestButton.textContent = '测速';
    renderPoolRows();
  }
}

function renderRows() {
  const supported = state.proxies.filter(proxy => proxy.supported).length;
  countLabel.textContent = `${state.proxies.length} 个节点，${supported} 个可用，${state.poolIds.length} 个已入池`;
  selectionSummary.textContent = `本批次已选择 ${state.selectedIds.length} 个，代理池已有 ${state.poolIds.length} 个`;
  if (!state.proxies.length) {
    rows.innerHTML = `<tr><td colspan='6' class='clash-empty'>没有解析到代理节点</td></tr>`;
    renderKernels();
    return;
  }
  rows.innerHTML = state.proxies.map(proxy => {
    const disabled = !proxy.supported;
    const selected = state.selectedIds.includes(proxy.id);
    const inPool = state.poolIds.includes(proxy.id);
    const checked = selected ? ' checked' : '';
    const disabledAttr = disabled ? ' disabled' : '';
    const poolMark = inPool ? `<span class='clash-pool-mark'>已入池</span>` : '';
    return `<tr class='${disabled ? 'is-disabled' : ''}${selected ? ' is-selected' : ''}${inPool ? ' is-in-pool' : ''}'>
      <td><label class='clash-choice'><input type='checkbox' name='clash-node' value='${escapeHtml(proxy.id)}'${checked}${disabledAttr}><span class='clash-node-name'>${escapeHtml(proxy.name)}</span>${poolMark}</label></td>
      <td>${escapeHtml(proxy.type)}</td>
      <td>${escapeHtml(proxy.server)}${disabled ? `<div class='clash-reason'>${escapeHtml(proxy.reason)}</div>` : ''}</td>
      <td>${escapeHtml(proxy.port || '-')}</td>
      <td>${speedState(proxy)}</td>
      <td>${speedLatency(proxy)}</td>
    </tr>`;
  }).join('');
  renderKernels();
}

async function testProxies() {
  const proxyIds = state.proxies.filter(proxy => proxy.supported).map(proxy => proxy.id);
  if (!proxyIds.length || state.testing) return;
  state.testing = true;
  state.testingIds = proxyIds;
  testButton.disabled = true;
  testButton.textContent = `测速中… 0/${proxyIds.length}`;
  renderRows();
  let streamDone = false;
  try {
    await streamApi('POST', '/proxy/clash/test/stream', {
      yaml: state.yaml,
      proxy_ids: proxyIds,
      selected_kernel: state.selectedKernel === 'auto' ? null : state.selectedKernel,
    }, event => {
      if (event.type === 'result') {
        const proxy = state.proxies.find(item => item.id === event.proxy_id);
        if (proxy) proxy.speed = event.result || {};
        state.testingIds = state.testingIds.filter(proxyId => proxyId !== event.proxy_id);
        const completed = Number(event.completed) || (proxyIds.length - state.testingIds.length);
        const total = Number(event.total) || proxyIds.length;
        testButton.textContent = `测速中… ${completed}/${total}`;
        renderRows();
        return;
      }
      if (event.type === 'done') {
        streamDone = true;
        const selectedIds = [...state.selectedIds];
        if (event.state) {
          applyDraftPayload(event.state);
          state.selectedIds = selectedIds.filter(proxyId => state.proxies.some(proxy => proxy.id === proxyId));
          renderRows();
        }
        return;
      }
      if (event.type === 'error') {
        throw new Error(event.message || '测速失败');
      }
    });
    if (!streamDone) throw new Error('测速流意外结束');
  } catch (error) {
    showToast(error.message || '测速失败', 'error');
  } finally {
    state.testing = false;
    state.testingIds = [];
    testButton.disabled = false;
    testButton.textContent = '重新测速';
    renderRows();
  }
}

async function parseYaml() {
  const raw = yamlInput.value.trim();
  if (!raw) {
    showToast('请输入 Clash YAML 内容', 'error');
    return;
  }
  parseButton.disabled = true;
  parseButton.textContent = '解析中…';
  try {
    const payload = await callApi('POST', '/proxy/clash/parse', { yaml: raw });
    applyDraftPayload(payload);
    state.selectedIds = state.poolIds.filter(proxyId => state.proxies.some(proxy => proxy.id === proxyId && proxy.supported));
    syncSelectedKernel();
    renderRows();
    setStep(2);
    await testProxies();
  } catch (error) {
    showToast(error.message || '解析失败', 'error');
  } finally {
    parseButton.disabled = false;
    parseButton.textContent = '解析代理';
  }
}

async function applyClash() {
  const proxyIds = state.selectedIds.filter(proxyId => state.proxies.some(proxy => proxy.id === proxyId && proxy.supported));
  if (!proxyIds.length) {
    showToast('请至少勾选一个可用节点加入代理池', 'error');
    return;
  }
  applyButton.disabled = true;
  applyButton.textContent = '加入中…';
  try {
    const payload = await callApi('POST', '/proxy/clash', {
      yaml: state.yaml,
      proxy_ids: proxyIds,
      selected_kernel: state.selectedKernel === 'auto' ? null : state.selectedKernel,
      enabled: true,
    });
    applyPoolPayload(payload);
    renderStatus();
    renderPoolRows();
    closeImportModal();
    showToast(`已保存到代理池，共 ${poolState.poolIds.length} 个节点`, 'success');
  } catch (error) {
    showToast(error.message || '加入代理池失败', 'error');
  } finally {
    updateApplyButton();
    applyButton.textContent = '加入池子并启用';
  }
}

async function disableClash() {
  if (!poolState.enabled) {
    showToast('Clash 代理当前未启用', 'info');
    return;
  }
  disableButton.disabled = true;
  try {
    const payload = await callApi('POST', '/proxy/clash', { enabled: false });
    applyPoolPayload(payload);
    renderStatus();
    renderPoolRows();
    showToast('Clash 代理已关闭，代理池配置保留', 'success');
  } catch (error) {
    disableButton.disabled = false;
    showToast(error.message || '关闭失败', 'error');
  }
}

rows.addEventListener('change', event => {
  const input = event.target.closest('input[name=clash-node]');
  if (!input) return;
  if (input.checked) {
    if (!state.selectedIds.includes(input.value)) state.selectedIds.push(input.value);
  } else {
    state.selectedIds = state.selectedIds.filter(proxyId => proxyId !== input.value);
  }
  renderRows();
});
kernelList.addEventListener('change', event => {
  const kernel = event.target.closest('input[name=clash-kernel]');
  if (kernel) {
    state.selectedKernel = kernel.value;
    updateApplyButton();
  }
});
kernelList.addEventListener('click', async event => {
  const button = event.target.closest('.clash-kernel-download');
  if (!button) return;
  const kernel = button.dataset.kernel;
  button.disabled = true;
  button.textContent = '准备中…';
  try {
    await callApi('POST', `/proxy/clash/kernels/${encodeURIComponent(kernel)}/download`);
    const payload = await callApi('GET', '/proxy/clash');
    const selectedIds = [...state.selectedIds];
    applyDraftPayload(payload);
    state.selectedIds = selectedIds;
    state.selectedKernel = kernel;
    renderRows();
    showToast(`${kernel} 内核已准备`, 'success');
  } catch (error) {
    button.disabled = false;
    button.textContent = '准备';
    showToast(error.message || '内核准备失败', 'error');
  }
});
openImportButton.addEventListener('click', openImportModal);
modalCloseButton.addEventListener('click', closeImportModal);
cancelInputButton.addEventListener('click', closeImportModal);
importModal.addEventListener('click', event => {
  if (event.target === importModal) closeImportModal();
});
document.addEventListener('keydown', event => {
  if (event.key === 'Escape' && importModal.classList.contains('open')) closeImportModal();
});
parseButton.addEventListener('click', parseYaml);
testButton.addEventListener('click', testProxies);
poolTestButton.addEventListener('click', testPoolProxies);
applyButton.addEventListener('click', applyClash);
disableButton.addEventListener('click', disableClash);
document.getElementById('clash-back').addEventListener('click', () => setStep(1));

async function boot() {
  try {
    await renderAdminHeader?.();
    await renderSiteFooter?.();
    const key = await adminKey.get();
    if (!key || !await verifyKey(ADMIN_API + '/verify', key).catch(() => false)) {
      location.href = '/admin/login';
      return;
    }
    const payload = await callApi('GET', '/proxy/clash');
    applyPoolPayload(payload);
    renderStatus();
    renderPoolRows();
  } catch (error) {
    showToast(error.message || '页面加载失败', 'error');
  }
}

boot();
</script>
</body>
</html>
